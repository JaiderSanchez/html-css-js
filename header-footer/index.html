<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <!-- Boxicons (Íconos) -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <title>Header & Footer Demo</title>
</head>
<body>

    <!-- HEADER / NAVEGACIÓN -->
    <header class="header">
        <a href="#" class="logo">DevPortfolio<span>.</span></a>

        <nav class="navbar">
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>

        <a href="#" class="header-btn">Get Started</a>
    </header>

    <!-- CONTENIDO PRINCIPAL (Relleno de demostración) -->
    <main class="content">
        <h1>Welcome to My Website</h1>
        <p>Clean design with smooth CSS animations.</p>
    </main>

    <!-- FOOTER / PIE DE PÁGINA -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <a href="#" class="logo">DevPortfolio<span>.</span></a>
                <p>Building clean and responsive web applications.</p>
            </div>

            <!-- REDES SOCIALES -->
            <div class="social-links">
                <a href="https://github.com" target="_blank" aria-label="GitHub"><i class="bx bxl-github"></i></a>
                <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"><i class="bx bxl-linkedin"></i></a>
                <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="bx bxl-instagram"></i></a>
                <a href="https://twitter.com" target="_blank" aria-label="Twitter"><i class="bx bxl-twitter"></i></a>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 DevPortfolio. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
